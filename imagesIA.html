<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coisas que eu gosto 💗</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(#ffd6e7, #ffeef5);
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        h1 {
            color: rgb(230, 65, 131);
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.8);
        }

        .img-destaque {
            width: 300px;
            height: 300px;
            object-fit: cover;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .img-pequena {
            width: 250px;
            height: 250px;
            object-fit: cover;
        }

        img {
            border-radius: 25px;
            border: 4px solid white;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            transition: 0.3s;
        }

        img:hover {
            transform: scale(1.05);
            border-color: rgb(255, 87, 154);
            box-shadow: 0 10px 22px rgba(255, 87, 154, 0.4);
        }

        .destaque {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <h1>💖 Coisas que eu gosto 💖</h1>

    <div class="destaque">
        <img class="img-destaque" src="mdt.webp" alt="Mundo Torajo">
    </div>

    <div class="galeria">
        <img class="img-pequena" src="deltarune.jpg" alt="Deltarune">
        <img class="img-pequena" src="undertale.jpg" alt="Undertale">
    </div>

</body>

</html>
