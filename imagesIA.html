<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coisas que eu gosto</title>

    <style>
        body {
            background: linear-gradient(lightpink, #ffeef5); /* MUDANÇA 1 */
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: deeppink;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 25px; /* MUDANÇA 2 */
            margin-top: 30px;
        }

        .img-destaque {
            width: 250px;
            height: 250px;
            object-fit: cover;
            margin-top: 20px;
        }

        .img-pequena {
            width: 220px;
            height: 220px;
            object-fit: cover;
        }

        img {
            border-radius: 20px;
            border: 4px solid hotpink;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2); /* MUDANÇA 3 */
        }

        img:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>

</head>

<body>

    <h1>💖 Coisas que eu gosto 💖</h1>

    <img class="img-destaque" src="mdt.webp" alt="Mundo Torajo">

    <div class="galeria">
        <img class="img-pequena" src="deltarune.jpg" alt="Deltarune">
        <img class="img-pequena" src="undertale.jpg" alt="Undertale">
    </div>

</body>

</html>
